# 10 minutes idle -> screensaver
# 3 hours of screensaver (3h 10m from last input) -> lock, which blanks the display
#
# Stay-awake (coffee cup on the bar) and `omarchy toggle screensaver` are honored
# by ~/.config/hypr/idle-action. Do not copy the packaged sample: it suspends.

general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = omarchy-system-lock
    after_sleep_cmd = omarchy-system-wake
}

listener {
    timeout = 600
    on-timeout = /home/michael/.config/hypr/idle-action screensaver
}

listener {
    timeout = 11400
    on-timeout = /home/michael/.config/hypr/idle-action lock
    on-resume = omarchy-system-wake
}

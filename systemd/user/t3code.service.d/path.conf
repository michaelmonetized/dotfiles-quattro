[Service]
# Same idea as the Mac LaunchDaemon PATH: systemd user units do not load zsh.
# Provider CLIs (grok, claude, codex, opencode) live outside /usr/bin.
Environment=PATH=/home/michael/.grok/bin:/home/michael/.local/bin:/home/michael/.vite-plus/bin:/home/michael/.vite-plus/js_runtime/node/24.19.0/bin:/home/michael/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin
Environment=HOME=/home/michael
Environment=NODE_ENV=production
